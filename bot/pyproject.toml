[project]
name = "shelf-audit-bot"
version = "0.1.0"
description = "Telegram bot of the sales agent: photo -> report card -> ✅ / 🔄 (aiogram 3, talks to the shelf-audit API)"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.13", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
shelf-audit-bot = "shelf_bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelf_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
