# gitleaks config: default rules + project-specific ones (legacy n8n exports had the bot token inline, BACKLOG №7)
[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b\d{8,10}:[A-Za-z0-9_-]{35}\b'''
tags = ["telegram"]

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''\bAIza[0-9A-Za-z_-]{35}\b'''
tags = ["google"]

[[rules]]
id = "openrouter-key"
description = "OpenRouter key"
regex = '''\bsk-or-v1-[0-9a-f]{64}\b'''
tags = ["openrouter"]

[allowlist]
description = "fixtures are model outputs, lockfiles are hashes"
paths = ['''frontend/package-lock\.json''']
