[project]
name = "shelf-audit-mcp"
version = "0.1.0"
description = "MCP server over the shelf-audit API: analyze a shelf photo, search the catalog, store reports, review queue"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.10", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
shelf-audit-mcp = "shelf_audit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelf_audit_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
